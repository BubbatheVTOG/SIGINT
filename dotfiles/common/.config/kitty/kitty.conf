shell /usr/bin/zsh
font_family      Inconsolata Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
window_padding_width 4

# background_opacity 1.0
background_opacity 0.7

# --- Colors ---
# Constant color values live here; themed values (cursor, selection_background,
# url_color, active_border_color, active_tab_background, color4/6/12/14) are
# generated by toggle-theme.sh into the included palette file below.
# kitty "last value wins": include at end lets the palette override.

# The basic colors
background              #000000
selection_foreground    #000000

# Cursor colors
cursor_text_color       #000000

# Kitty window border colors
inactive_border_color   #1a1a1a

# Tab bar colors
active_tab_foreground   #000000
inactive_tab_foreground #ffffff
inactive_tab_background #1a1a1a

# The 16 terminal colors — constants (non-themed)

# Black
color0 #000000
color8 #4d4d4d

# Red (kept standard for errors)
color1 #ff5555
color9 #ff6e6e

# Green (muted - less aggressive)
color2  #50fa7b
color10 #50fa7b

# Yellow
color3  #f1fa8c
color11 #f1fa8c

# Magenta
color5  #bd93f9
color13 #ff79c6

# White
color7  #bfbfbf
color15 #ffffff

# Themed colors (cursor, selection_background, url_color, active_border_color,
# active_tab_background, color4/6/12/14) come from the palette file below.
include ~/.config/theme/kitty.conf