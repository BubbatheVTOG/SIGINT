# Shared hyprlock config — sourced by both sigint and matt hyprlock.conf.
# Theme palette ($accent, $wallpaper) comes from ~/.config/theme/hyprlock.conf
# (generated by toggle-theme.sh). This file is byte-identical on both hosts.
#
# The `background {}` block is NOT here — it is host-specific. A live
# `path = screenshot` background captures the compositor framebuffer into a
# GPU texture on every lock. That allocation fails (and hangs the lock screen)
# when the GPU is full. On matt, vLLM --tensor-parallel-size 2 --gpu-memory-
# utilization 0.85 leaves ~0 of 24 GiB free, so NVKMS rejects the capture
# ("Failed to allocate NVKMS memory for GEM object") and hyprlock renders
# nothing. Each host's hyprlock.conf owns its own background block instead:
#   matt   -> path = $wallpaper   (static themed JPEG, ~8 MiB/monitor)
#   sigint -> path = screenshot   (Asahi iGPU has headroom)

general {
    hide_cursor = true
    ignore_empty_input = false
    # Render the color field before the background image finishes loading so
    # the lock is never a blank/TTY frame even if the image is slow.
    immediate_render = true
    fail_timeout = 2000
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(0, 0, 0, 1.0)
    font_size = 120
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, -500
    halign = center
    valign = top
    shadow_passes = 1
    shadow_size = 3
    shadow_color = $accent
    shadow_boost = 2.0
}

# USER
label {
    monitor =
    text =
    color = rgba(200, 200, 200, 1.0)
    font_size = 25
    font_family = JetBrainsMono Nerd Font
    position = 0, 0
    halign = center
    valign = center
}

# BATTERY — shows on devices with /sys/class/power_supply/macsmc-battery,
# renders nothing on machines without it (e.g. matt desktop).
label {
    monitor =
    text = cmd[update:1000] cat /sys/class/power_supply/macsmc-battery/capacity 2>/dev/null | awk "{print \$1\"%\"}"
    color = rgba(200, 200, 200, 1.0)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = -30, 30
    halign = right
    valign = bottom
}

# INPUT FIELD
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    rounding = 0
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = $accent
    inner_color = rgba(0, 0, 0, 0.5)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}
