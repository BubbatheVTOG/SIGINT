# Shared hyprlock config — sourced by both sigint and matt hyprlock.conf.
# Theme palette ($accent) comes from ~/.config/theme/hyprlock.conf (generated
# by toggle-theme.sh). This file is byte-identical on both hosts.

general {
    hide_cursor = true
    ignore_empty_input = false
    immediate_render = false
    fail_timeout = 2000
}

background {
    monitor =
    path = screenshot
    color = rgba(10, 10, 12, 1.0)
    blur_passes = 2
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(0, 0, 0, 1.0)
    font_size = 120
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, -500
    halign = center
    valign = top
    shadow_passes = 1
    shadow_size = 3
    shadow_color = $accent
    shadow_boost = 2.0
}

# USER
label {
    monitor =
    text =
    color = rgba(200, 200, 200, 1.0)
    font_size = 25
    font_family = JetBrainsMono Nerd Font
    position = 0, 0
    halign = center
    valign = center
}

# BATTERY — shows on devices with /sys/class/power_supply/macsmc-battery,
# renders nothing on machines without it (e.g. matt desktop).
label {
    monitor =
    text = cmd[update:1000] cat /sys/class/power_supply/macsmc-battery/capacity 2>/dev/null | awk "{print \$1\"%\"}"
    color = rgba(200, 200, 200, 1.0)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = -30, 30
    halign = right
    valign = bottom
}

# INPUT FIELD
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    rounding = 0
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = $accent
    inner_color = rgba(0, 0, 0, 0.5)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}
