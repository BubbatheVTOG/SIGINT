source = ~/.config/theme/hyprlock.conf
source = ~/.config/hypr/hyprlock-base.conf

# sigint background: live framebuffer capture (blurred screenshot). The Asahi
# iGPU has headroom for this, unlike matt's NVIDIA GPU which is kept full by
# vLLM. See matt/.config/hypr/hyprlock.conf for why matt cannot use this.
background {
    monitor =
    path = screenshot
    color = rgba(10, 10, 12, 1.0)
    blur_passes = 2
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}
