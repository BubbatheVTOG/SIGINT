# greetd configuration — managed via SIGINT dotfiles (system-sigint package)
# Install: sudo stow -R -t / system-sigint   (from the repo's dotfiles/ dir)
# Docs:  man 5 greetd | https://man.sr.ht/~kennylevinsen/greetd/
#
# NOTE: sigint is Fedora Asahi ARM. It differs from matt (Arch x86_64) in two
# ways that make the shared `system` package's greetd config wrong here:
#   1. The greeter runs as user `greetd` (Fedora), not `greeter` (Arch).
#   2. Hyprland must be launched via the `start-hyprland` wrapper (Asahi GPU
#      setup), not the bare `Hyprland` binary.

[terminal]
# The VT to run the greeter on.
vt = 1

[default_session]
# tuigreet greeter, accented to match the teal desktop theme.
#   --time      show a clock on the greeter
#   --remember  remember the last logged-in username
#   --cmd       session command started after successful login
command = "tuigreet --time --remember --cmd start-hyprland --theme 'container=black;text=cyan;prompt=cyan;input=cyan;action=cyan;button=cyan;border=cyan;time=cyan;greet=cyan;title=cyan' --container-padding 2 --prompt-padding 2 --width 120"
user = "greetd"
