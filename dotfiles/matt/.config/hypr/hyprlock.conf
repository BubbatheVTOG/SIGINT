source = ~/.config/theme/hyprlock.conf
source = ~/.config/hypr/hyprlock-base.conf

# matt background: static themed wallpaper, NOT a live framebuffer capture.
# This host runs vLLM with --tensor-parallel-size 2 --gpu-memory-utilization
# 0.85, which leaves ~0 of 24 GiB GPU free. `path = screenshot` captures the
# compositor output into an NVKMS texture on every lock; that allocation
# fails under VRAM pressure ("Failed to allocate NVKMS memory for GEM
# object") and hyprlock renders a blank, unresponsive screen. $wallpaper is
# a single ~8 MiB JPEG per monitor decoded from disk, which always fits.
background {
    monitor =
    path = $wallpaper
    color = rgba(10, 10, 12, 1.0)
    blur_passes = 2
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}
