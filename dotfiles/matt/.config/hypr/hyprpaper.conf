splash = false

# Theme wallpaper ($wallpaper) generated by toggle-theme.sh into ~/.config/theme/hyprpaper.conf
source = ~/.config/theme/hyprpaper.conf

# matt (desktop): 3 monitors — DP-1 (left, rotated), DP-2 (center), DP-3 (right, rotated)
wallpaper {
    monitor = DP-1
    path = $wallpaper
    fit_mode = cover
}

wallpaper {
    monitor = DP-2
    path = $wallpaper
    fit_mode = cover
}

wallpaper {
    monitor = DP-3
    path = $wallpaper
    fit_mode = cover
}
