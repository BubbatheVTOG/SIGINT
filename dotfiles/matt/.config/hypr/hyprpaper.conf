splash = false

# Theme wallpaper ($wallpaper) generated by toggle-theme.sh into ~/.config/theme/hyprpaper.conf
source = ~/.config/theme/hyprpaper.conf

# matt (desktop): 3 monitors — DP-4 (left, rotated), DP-5 (center), DP-6 (right, rotated)
wallpaper {
    monitor = DP-4
    path = $wallpaper
    fit_mode = cover
}

wallpaper {
    monitor = DP-5
    path = $wallpaper
    fit_mode = cover
}

wallpaper {
    monitor = DP-6
    path = $wallpaper
    fit_mode = cover
}
