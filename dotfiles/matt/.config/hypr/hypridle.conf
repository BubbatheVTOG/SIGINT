general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'  # display on after sleep (lua backend: legacy 'dispatch dpms' is broken)
}

# 1. Lock screen
listener {
    timeout = 300                                # 5 min
    on-timeout = loginctl lock-session           # lock screen
}

# 1b. Screen off after lock
listener {
    timeout = 60                                 # 1 min
    on-timeout = pidof hyprlock && hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'  # screen off if locked
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'                      # screen on
}

# NOTE: no auto-suspend on matt — desktop runs long-lived jobs (llamacpp/vllm).
# Matches the pre-migration live behavior (lock + dpms only).
